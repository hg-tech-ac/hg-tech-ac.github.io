<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101c">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>관리자 로그인</title>
  <link rel="stylesheet" href="../../assets/style.css?v=20260804-2218">
  <link rel="stylesheet" href="../../assets/login-v2.css?v=20260804-2218">
  <script src="../../config.js?v=20260804-2218"></script>
  <script defer src="../../assets/auth.js?v=20260804-2218"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="loginTitle">
      <p class="eyebrow">ADMIN ACCESS</p>
      <h1 id="loginTitle">관리자 로그인</h1>
      <p class="muted">기술실 에어컨 제어는 승인된 관리자만 사용할 수 있습니다.</p>

      <form id="loginForm" class="form-stack">
        <label for="userId">
          관리자 ID
          <input id="userId" name="userId" autocomplete="username" required placeholder="관리자 ID">
        </label>
        <label for="password">
          비밀번호
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="비밀번호">
        </label>
        <button id="loginButton" class="button primary large" type="submit">로그인</button>
      </form>

      <p id="loginMessage" class="form-message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <div id="loginProgressOverlay" class="login-progress-overlay" role="dialog" aria-modal="true" aria-labelledby="loginProgressTitle" hidden>
    <section class="login-progress-card">
      <div class="login-spinner" aria-hidden="true"></div>
      <strong id="loginProgressTitle">로그인 시도중입니다</strong>
      <p id="loginProgressText">관리자 정보를 안전하게 확인하고 있습니다.</p>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const form = document.getElementById('loginForm');
      const button = document.getElementById('loginButton');
      const message = document.getElementById('loginMessage');
      const inputs = [...form.querySelectorAll('input, button')];
      const overlay = document.getElementById('loginProgressOverlay');
      const progressTitle = document.getElementById('loginProgressTitle');
      const progressText = document.getElementById('loginProgressText');
      let submitting = false;

      function setBusy(busy, title = '로그인 시도중입니다', detail = '관리자 정보를 안전하게 확인하고 있습니다.') {
        submitting = busy;
        inputs.forEach(control => { control.disabled = busy; });
        document.body.classList.toggle('login-busy', busy);
        progressTitle.textContent = title;
        progressText.textContent = detail;
        overlay.hidden = !busy;
      }

      function showError(text) {
        message.textContent = text;
        message.className = 'form-message error';
      }

      if (!window.HG_AUTH || !window.HG_CONFIG?.API_URL) {
        setBusy(false);
        showError('로그인 설정을 불러오지 못했습니다. 페이지를 새로고침하세요.');
        return;
      }

      setBusy(true, '서버 연결 확인 중입니다', 'Apps Script 서버와 관리자 인증 상태를 확인하고 있습니다.');

      try {
        const health = await window.HG_AUTH.jsonp({ action: 'health' });
        if (!health?.ok) throw new Error(health?.message || '서버 응답이 올바르지 않습니다.');
      } catch (error) {
        localStorage.removeItem(window.HG_AUTH.sessionKey);
        setBusy(false);
        showError(error.message || 'Apps Script 서버에 연결하지 못했습니다.');
        return;
      }

      try {
        const existing = await window.HG_AUTH.validateSession();
        if (existing) {
          progressTitle.textContent = '인증되었습니다';
          progressText.textContent = '관리자 대시보드로 이동합니다.';
          location.replace('../dashboard/');
          return;
        }
      } catch (_) {
        localStorage.removeItem(window.HG_AUTH.sessionKey);
      }

      setBusy(false);
      document.getElementById('userId').focus();

      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (submitting) return;

        const userId = document.getElementById('userId').value.trim();
        const password = document.getElementById('password').value;

        if (!userId || !password) {
          showError('관리자 ID와 비밀번호를 입력하세요.');
          return;
        }

        message.textContent = '';
        message.className = 'form-message';
        setBusy(true, '로그인 시도중입니다', '아이디와 비밀번호를 확인하고 있습니다. 잠시만 기다려 주세요.');

        try {
          await window.HG_AUTH.login(userId, password);
          progressTitle.textContent = '로그인되었습니다';
          progressText.textContent = '관리자 대시보드로 이동합니다.';
          location.replace('../dashboard/');
        } catch (error) {
          setBusy(false);
          showError(error.message || '로그인에 실패했습니다.');
          document.getElementById('password').focus();
          document.getElementById('password').select();
        }
      });
    });
  </script>
</body>
</html>
